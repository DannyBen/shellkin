name: shellkin
help: |
  Gherkin-style BDD framework for command-line tools and shell scripts
  Supports configuration from a .shellkin argfile in the working directory
version: 0.2.1

argfile: .shellkin

args:
- name: target
  help: |
    Target to test. Can be in one of these forms:

    - DIR = Features directory
    - FILE = *.feature file
    - NUMBER = Scenario number in the default target
    - DIR:NUMBER = Scenario number in DIR
    - FILE:NUMBER = Scenario number in FILE

    Default: value of --default-target

flags:
- long: --fail-fast
  short: -f
  help: Abort after the first failing scenario
  conflicts: [--init]
- long: --validate
  short: -v
  help: Validate feature and step definition files
  conflicts: [--init, --tag, --exclude-tag]
- long: --init
  help: Initialize a Shellkin features directory
  conflicts: [--validate, --fail-fast, --load, --tag, --exclude-tag]
- long: --default-target
  help: |
    Path to features directory  
    Relative to working directory  
    Normally only used in a .shellkin argfile
  arg: dir
  default: features
- long: --tag
  short: -t
  arg: tag
  help: Run scenarios with this tag
  repeatable: true
  conflicts: [--init, --validate]
- long: --exclude-tag
  short: -x
  arg: tag
  help: Skip scenarios with this tag
  repeatable: true
  conflicts: [--init, --validate]
- long: --stepdefs
  short: -s
  arg: dir
  help: |
    Path to step definitions directory  
    Relative to features root
  default: step_definitions
- long: --load
  short: -l
  arg: support_script
  help: |
    Path to support script for step definitions  
    Relative to features root  
    support.sh is loaded automatically
  repeatable: true
  conflicts: [--init]


# Manpages Extras

