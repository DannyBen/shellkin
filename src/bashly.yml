name: shellkin
help: Gherkin-style BDD Test Framework for Bash Scripts
version: 0.1.1

x_mandoc_authors: Danny Ben Shitrit <https://github.com/dannyben>
x_mandoc_see_also: &alf-conf-man
  - shellkin-stepdefs(5)
  - shellkin-feature(5)
x_mandoc_footer: |-
  # SOURCE CODE

  https://github.com/dannyben/shellkin

  # ISSUE TRACKER
  
  https://github.com/dannyben/shellkin/issues

environment_variables:
- name: shellkin_features_root
  help: Path to features directory (relative to working directory)
  default: features
- name: shellkin_stepdefs_root
  help: Path to step definitions directory (relative to features root)
  default: step_definitions

commands:
- name: test
  alias: t
  default: force
  help: Run feature tests

  args:
  - name: target
    default: "$SHELLKIN_FEATURES_ROOT"
    help: Path to features directory or a single feature file
    validate: [test_target]

  flags:
  - long: --fail-fast
    short: -f
    help: Abort after the first failing scenario
