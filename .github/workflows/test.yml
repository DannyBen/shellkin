name: Test
on:
  pull_request:
  push: { branches: master }

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install test dependencies
      run: sudo apt-get update && sudo apt-get install -y bats shellcheck
    - name: Run shellcheck tests
      run: shellcheck shellkin setup uninstall
    - name: Run Bats tests
      run: bats --recursive --print-output-on-failure test
    - name: Run Shellkin tests
      run: ./shellkin

  ubuntu_setup:
    name: Setup on Ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run setup
      run:
        ./setup
        command -v shellkin
    - name: Run uninstall
      run:
        ./uninstall
        ! command -v shellkin
